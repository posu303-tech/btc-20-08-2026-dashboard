name: update-data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and compute market context
        run: node scripts/update-data.mjs

      - name: Commit and push state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh state.json [skip ci]"
            git push
          fi